<meta charset="utf-8">
<title>BTI Guatemala — Distribución de agua</title>
<style>
:root{
  --ink:#0d1b26; --ink2:#2a4155; --mut:#6c8496; --line:#dbe5eb;
  --bg:#f2f6f8; --card:#ffffff;
  --a1:#0b6e8f; --a2:#28a1a8; --a3:#7fc8a9; --a4:#f0a442; --a5:#d1495b; --a6:#5b7fa6;
  --grid:#e8eff3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 "Segoe UI",Roboto,-apple-system,Helvetica,Arial,sans-serif}
.num{font-family:"JetBrains Mono",Consolas,"SF Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
#app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
aside{width:212px;flex:0 0 212px;background:var(--ink);color:#c9dae4;padding:18px 0;position:sticky;top:0;height:100vh}
aside h1{font-size:13px;letter-spacing:.13em;text-transform:uppercase;margin:0 18px 2px;color:#fff;font-weight:600}
aside .sub{font-size:11px;color:#6f8ea2;margin:0 18px 22px}
nav a{display:block;padding:9px 18px;color:#a9c2d1;text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:pointer}
nav a:hover{background:#152a38;color:#fff}
nav a.on{background:#152a38;color:#fff;border-left-color:var(--a2)}
nav a i{display:inline-block;width:22px;color:#4d7a90}
aside .foot{position:absolute;bottom:14px;left:18px;right:18px;font-size:10.5px;color:#5c7d92}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:20px 24px 60px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.bar h2{margin:0;font-size:19px;font-weight:600}
.bar .desc{color:var(--mut);font-size:12.5px;flex:1;min-width:220px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--a1);color:#fff}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
@media(max-width:1150px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2,.g23,.g32{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{margin:0 0 2px;font-size:13px;font-weight:600}
.card .hint{color:var(--mut);font-size:11.5px;margin:0 0 10px}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.kpi .val{font-size:27px;font-weight:600;margin:5px 0 1px}
.kpi .un{font-size:13px;color:var(--mut);font-weight:400}
.kpi .dt{font-size:11.5px;color:var(--mut)}
.tag{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:600}
.ok{background:#e2f4ec;color:#1a7a56}.wr{background:#fdf0da;color:#96590a}.bd{background:#fbe4e7;color:#a32a3c}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em;
   padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
td{padding:6px 8px;border-bottom:1px solid #f0f5f8}
td.r,th.r{text-align:right}
tbody tr:hover{background:#f6fafc}
.scroll{max-height:420px;overflow:auto}
.note{background:#fff8e8;border:1px solid #f2dfb4;border-radius:8px;padding:11px 14px;font-size:12.5px;color:#6b4e11;margin-bottom:14px}
.note b{color:#4a3608}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:8px}
.lgd span{display:flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.page{display:none}.page.on{display:block}
svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-size:10.5px;fill:var(--mut)}
.vl{font-size:10.5px;fill:var(--ink2);font-weight:600}
</style>

<div id="app">
<aside>

/* ============================ helpers de SVG ============================ */
const C = ["#0b6e8f","#28a1a8","#7fc8a9","#f0a442","#d1495b","#5b7fa6","#9b6bb3","#3f8f5e","#c96a2e","#4a6d8c"];
const fmt=(v,d=0)=>v==null?"—":v.toLocaleString("es-GT",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(v,d=1)=>v==null?"—":(v*100).toFixed(d)+" %";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function svg(w,h,inner){return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`}
function ticks(max,n=4){const s=nice(max/n);const out=[];for(let v=0;v<=max*1.001;v+=s)out.push(v);return out}
function nice(x){const e=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/e;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}

/* barras horizontales */
function hbar(items,{w=520,rh=22,unit="m³",color=null,max=null}={}){
  const lw=90, pad=8, W=w, H=items.length*rh+16;
  const mx = max ?? Math.max(...items.map(d=>d.v),1);
  let s="";
  items.forEach((d,i)=>{
    const y=i*rh+8, bw=(W-lw-70)*(d.v/mx);
    s+=`<text class="ax" x="${lw-6}" y="${y+rh/2+3}" text-anchor="end">${esc(d.k)}</text>`;
    s+=`<rect x="${lw}" y="${y+3}" width="${Math.max(bw,1)}" height="${rh-9}" rx="2" fill="${d.c||color||C[i%C.length]}"/>`;
    s+=`<text class="vl" x="${lw+bw+6}" y="${y+rh/2+3}">${fmt(d.v,d.v<10?2:0)}</text>`;
  });
  return svg(W,H,s);
}

/* columnas agrupadas o apiladas */
function bars(cats,series,{w=560,h=230,stack=false,pct100=false,unit="m³"}={}){
  const L=48,R=10,T=12,B=28, iw=w-L-R, ih=h-T-B;
  let vals = pct100? cats.map((_,i)=>1) : (stack
      ? cats.map((_,i)=>series.reduce((a,s)=>a+(s.v[i]||0),0))
      : [Math.max(...series.flatMap(s=>s.v.filter(x=>x!=null)))]);
  const mx = Math.max(...vals,1)*(pct100?1:1.12);
  const y=v=>T+ih-ih*(v/mx);
  let s=`<line x1="${L}" y1="${T+ih}" x2="${w-R}" y2="${T+ih}" stroke="var(--line)"/>`;
  ticks(mx).forEach(t=>{s+=`<line x1="${L}" y1="${y(t)}" x2="${w-R}" y2="${y(t)}" stroke="var(--grid)"/>
    <text class="ax" x="${L-6}" y="${y(t)+3}" text-anchor="end">${pct100?Math.round(t*100)+"%":fmt(t,mx<12?1:0)}</text>`});
  const bw=iw/cats.length;
  cats.forEach((c,i)=>{
    const x0=L+i*bw;
    if(stack){
      const tot=series.reduce((a,s)=>a+(s.v[i]||0),0)||1; let acc=0;
      series.forEach((se,j)=>{
        const raw=se.v[i]||0, val=pct100?raw/tot:raw;
        const hh=ih*(val/mx);
        s+=`<rect x="${x0+bw*0.18}" y="${y(acc+val)}" width="${bw*0.64}" height="${Math.max(hh,0)}" fill="${se.c||C[j]}">
            <title>${esc(se.n)} · ${esc(c)}: ${fmt(raw,0)} ${unit}</title></rect>`;
        if(hh>15)s+=`<text class="vl" x="${x0+bw/2}" y="${y(acc+val/2)+4}" text-anchor="middle" fill="#fff">${pct100?Math.round(val*100)+"%":fmt(raw)}</text>`;
        acc+=val;
      });
    }else{
      const n=series.length, gw=bw*0.72/n;
      series.forEach((se,j)=>{
        const val=se.v[i]||0, hh=ih*(val/mx);
        s+=`<rect x="${x0+bw*0.14+j*gw}" y="${y(val)}" width="${gw*0.86}" height="${Math.max(hh,0)}" rx="2" fill="${se.c||C[j]}">
            <title>${esc(se.n)} · ${esc(c)}: ${fmt(val,2)} ${unit}</title></rect>`;
      });
    }
    s+=`<text class="ax" x="${x0+bw/2}" y="${T+ih+16}" text-anchor="middle">${esc(c)}</text>`;
  });
  return svg(w,h,s);
}

/* área / líneas */
function area(labels,series,{w=560,h=210,fill=true,xevery=null,unit="m³"}={}){
  const L=46,R=12,T=10,B=26,iw=w-L-R,ih=h-T-B;
  const mx=Math.max(...series.flatMap(s=>s.v),1)*1.12;
  const X=i=>L+iw*(labels.length<2?0.5:i/(labels.length-1));
  const Y=v=>T+ih-ih*(v/mx);
  let s=`<line x1="${L}" y1="${T+ih}" x2="${w-R}" y2="${T+ih}" stroke="var(--line)"/>`;
  ticks(mx).forEach(t=>{s+=`<line x1="${L}" y1="${Y(t)}" x2="${w-R}" y2="${Y(t)}" stroke="var(--grid)"/>
    <text class="ax" x="${L-6}" y="${Y(t)+3}" text-anchor="end">${fmt(t,mx<12?1:0)}</text>`});
  series.forEach((se,j)=>{
    const pts=se.v.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
    if(fill)s+=`<polygon points="${X(0)},${Y(0)} ${pts} ${X(se.v.length-1)},${Y(0)}" fill="${se.c||C[j]}" opacity=".16"/>`;
    s+=`<polyline points="${pts}" fill="none" stroke="${se.c||C[j]}" stroke-width="2" stroke-linejoin="round"/>`;
  });
  const ev = xevery || Math.ceil(labels.length/8);
  labels.forEach((l,i)=>{ if(i%ev===0) s+=`<text class="ax" x="${X(i)}" y="${T+ih+16}" text-anchor="middle">${esc(l)}</text>`});
  return svg(w,h,s);
}

/* dona */
function donut(items,{w=300,h=230,unit="m³"}={}){
  const cx=w/2,cy=h/2,r=82,ir=50;
  const tot=items.reduce((a,d)=>a+d.v,0)||1; let ang=-Math.PI/2, s="";
  items.forEach((d,i)=>{
    const a2=ang+2*Math.PI*(d.v/tot);
    const p=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
    const [x1,y1]=p(ang,r),[x2,y2]=p(a2,r),[x3,y3]=p(a2,ir),[x4,y4]=p(ang,ir);
    const big=(a2-ang)>Math.PI?1:0;
    s+=`<path d="M${x1},${y1} A${r},${r} 0 ${big} 1 ${x2},${y2} L${x3},${y3} A${ir},${ir} 0 ${big} 0 ${x4},${y4} Z"
        fill="${d.c||C[i]}"><title>${esc(d.k)}: ${fmt(d.v)} ${unit} (${pct(d.v/tot)})</title></path>`;
    if(d.v/tot>0.05){const [tx,ty]=p((ang+a2)/2,(r+ir)/2);
      s+=`<text class="vl" x="${tx}" y="${ty+3}" text-anchor="middle" fill="#fff">${Math.round(100*d.v/tot)}%</text>`}
    ang=a2;
  });
  s+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="19" font-weight="600">${fmt(tot)}</text>
      <text class="ax" x="${cx}" y="${cy+13}" text-anchor="middle">${unit} totales</text>`;
  return svg(w,h,s);
}

/* cascada */
function waterfall(steps,{w=560,h=240,unit="m³"}={}){
  const L=52,R=12,T=14,B=42,iw=w-L-R,ih=h-T-B;
  let acc=0; const pts=[];
  steps.forEach(s=>{ if(s.total){pts.push({...s,from:0,to:s.v}); acc=s.v}
                     else {pts.push({...s,from:acc,to:acc+s.v}); acc+=s.v} });
  const mx=Math.max(...pts.map(p=>Math.max(p.from,p.to)))*1.15;
  const Y=v=>T+ih-ih*(v/mx), bw=iw/pts.length;
  let s=`<line x1="${L}" y1="${T+ih}" x2="${w-R}" y2="${T+ih}" stroke="var(--line)"/>`;
  ticks(mx).forEach(t=>{s+=`<line x1="${L}" y1="${Y(t)}" x2="${w-R}" y2="${Y(t)}" stroke="var(--grid)"/>
    <text class="ax" x="${L-6}" y="${Y(t)+3}" text-anchor="end">${fmt(t)}</text>`});
  pts.forEach((p,i)=>{
    const x=L+i*bw+bw*0.2, bwi=bw*0.6;
    const y0=Y(Math.max(p.from,p.to)), hh=Math.abs(Y(p.from)-Y(p.to));
    s+=`<rect x="${x}" y="${y0}" width="${bwi}" height="${Math.max(hh,2)}" rx="2" fill="${p.c}"/>`;
    s+=`<text class="vl" x="${x+bwi/2}" y="${y0-5}" text-anchor="middle">${fmt(Math.abs(p.v))}</text>`;
    const words=p.k.split(" "); let ln="",lines=[];
    words.forEach(wd=>{ if((ln+wd).length>13){lines.push(ln);ln=wd+" "}else ln+=wd+" "}); lines.push(ln);
    lines.forEach((l,j)=>{s+=`<text class="ax" x="${x+bwi/2}" y="${T+ih+15+j*11}" text-anchor="middle">${esc(l.trim())}</text>`});
    if(i<pts.length-1)s+=`<line x1="${x+bwi}" y1="${Y(p.to)}" x2="${L+(i+1)*bw+bw*0.2}" y2="${Y(p.to)}" stroke="#b8ccd8" stroke-dasharray="3 3"/>`;
  });
  return svg(w,h,s);
}

/* mapa de calor */
function heat(rows,cols,vals,{w=760,cell=22,lw=48,unit="m³"}={}){
  const mx=Math.max(...vals.flat().filter(v=>v!=null),1);
  const cw=Math.min((w-lw)/cols.length,42);
  const h=rows.length*cell+52;
  let s="";
  cols.forEach((c,j)=>{s+=`<text class="ax" x="${lw+j*cw+cw/2}" y="${40}" text-anchor="end" transform="rotate(-55 ${lw+j*cw+cw/2} 40)">${esc(c.replace("2026-",""))}</text>`});
  rows.forEach((r,i)=>{
    s+=`<text class="ax" x="${lw-6}" y="${52+i*cell+cell/2+3}" text-anchor="end">${esc(r)}</text>`;
    cols.forEach((c,j)=>{
      const v=vals[i][j], t=v==null?0:v/mx;
      const col = v==null||v===0 ? "#f4f8fa" : `rgba(11,110,143,${0.10+0.9*Math.pow(t,.65)})`;
      s+=`<rect x="${lw+j*cw}" y="${52+i*cell}" width="${cw-2}" height="${cell-2}" rx="2" fill="${col}">
          <title>${esc(r)} · ${esc(c)}: ${fmt(v,1)} ${unit}</title></rect>`;
      if(t>0.55)s+=`<text class="vl" x="${lw+j*cw+(cw-2)/2}" y="${52+i*cell+cell/2+3}" text-anchor="middle" fill="#fff" font-size="9">${fmt(v,0)}</text>`;
    });
  });
  return svg(lw+cols.length*cw, h, s);
}

/* diagrama de flujo hidráulico */
function flujo(){
  const N={
    "BOMB01":[40,20,"Bombeo\nPrincipal"], "CONT01":[190,10,"B.Principal"], "CONT02":[190,70,"B.Auxiliar"],
    "CONT03":[350,10,"Clarif. 1\nsalida"], "CONT04":[350,80,"Clarif. 2\nentrada"], "CONT05":[350,150,"Clarif. 2\nsalida"],
    "TQ":[500,80,"Tanques\n0 / 1-3"],
    "CONT07":[650,10,"Salida RD"], "CONT06":[650,90,"Salida CNP"], "CONT08":[650,165,"Servicios"],
    "CONT09":[810,-30,"P. Mayores"], "INV":[810,45,"Invernaderos\nRD"], "OTR":[810,120,"Otras áreas\n/ pérdidas"],
    "INVC":[810,190,"Invernaderos\nCNP"]
  };
  const val = k => (D.contador_mes.series[k]||[]).reduce((a,b)=>a+(b||0),0);
  const rp = D.reparto.reduce((a,r)=>({inv:a.inv+r.invernaderos,pm:a.pm+r.pmayores,ot:a.ot+r.otras,
                                       ci:a.ci+r.cnp_inv,co:a.co+r.cnp_otras}),{inv:0,pm:0,ot:0,ci:0,co:0});
  const E=[["BOMB01","CONT01",val("CONT01")],["BOMB01","CONT02",val("CONT02")],
    ["CONT01","CONT03",val("CONT03")],["CONT01","CONT04",val("CONT04")],["CONT04","CONT05",val("CONT05")],
    ["CONT03","TQ",val("CONT03")],["CONT05","TQ",val("CONT05")],
    ["TQ","CONT07",val("CONT07")],["TQ","CONT06",val("CONT06")],["TQ","CONT08",val("CONT08")],
    ["CONT07","CONT09",rp.pm],["CONT07","INV",rp.inv],["CONT07","OTR",rp.ot],
    ["CONT06","INVC",rp.ci]];
  const mx=Math.max(...E.map(e=>e[2]));
  const W=125,H=42, OY=45;
  let s="";
  E.forEach(([a,b,v])=>{
    const [x1,y1]=N[a],[x2,y2]=N[b];
    const sw=1.5+9*Math.sqrt(v/mx);
    const X1=x1+W, Y1=y1+OY+H/2, X2=x2, Y2=y2+OY+H/2, mid=(X1+X2)/2;
    s+=`<path d="M${X1},${Y1} C${mid},${Y1} ${mid},${Y2} ${X2},${Y2}" fill="none" stroke="#8fbdd1"
        stroke-opacity=".55" stroke-width="${sw}"><title>${a} → ${b}: ${fmt(v)} m³</title></path>`;
  });
  Object.entries(N).forEach(([k,[x,y,lab]])=>{
    const fin=["CONT09","INV","OTR","INVC"].includes(k);
    const col = fin? (k==="OTR"?"#fdeef0":"#e9f4f8") : "#ffffff";
    const bd  = fin? (k==="OTR"?"#e8b6bf":"#a9d2e2") : "#cfe0e9";
    s+=`<rect x="${x}" y="${y+OY}" width="${W}" height="${H}" rx="6" fill="${col}" stroke="${bd}"/>`;
    lab.split("\n").forEach((l,i)=>{
      s+=`<text x="${x+W/2}" y="${y+OY+(lab.includes("\n")?15:24)+i*13}" text-anchor="middle" font-size="11" font-weight="600" fill="#1d3a4d">${esc(l)}</text>`});
    if(k.startsWith("CONT")||k==="BOMB01")
      s+=`<text x="${x+W/2}" y="${y+OY-4}" text-anchor="middle" font-size="9" fill="#7d9aab">${k}</text>`;
  });
  return svg(960,300,s);
}

  return `
  <div class="note"><b>Cómo se calcula.</b> Invernaderos y "otras áreas" no tienen contador.
  Invernaderos se estima con volumen de gotero × plantas activas; "otras áreas" es el residual
  Salida RD − Invernaderos − P. Mayores. Si ese residual crece semana a semana, es fuga; si se mantiene, son áreas sin medir.</div>
  <div class="grid g3">
    <div class="card"><h3>Reparto — ${MESNOM[MES]}</h3><p class="hint">${R.dias} días comparables</p>
      ${donut([{k:"Invernaderos",v:R.invernaderos,c:C[1]},{k:"Extracción de semillas",v:R.pmayores,c:C[3]},
               {k:"Otras áreas",v:R.otras,c:C[4]}],{w:290,h:230})}</div>
    <div class="card" style="grid-column:span 2"><h3>Cascada de Salida RD</h3>
      <p class="hint">De lo que entrega el contador a lo que se explica.</p>${waterfall(wf,{w:560,h:250})}</div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Reparto mensual (100 %)</h3><p class="hint">Cómo cambia el destino del agua mes a mes.</p>
      ${bars(rows.map(r=>MESNOM[r.mes]),[
        {n:"Invernaderos",v:rows.map(r=>r.invernaderos),c:C[1]},
        {n:"Extracción de semillas",v:rows.map(r=>r.pmayores),c:C[3]},
        {n:"Otras áreas",v:rows.map(r=>r.otras),c:C[4]}],{w:520,h:230,stack:true,pct100:true})}
      <div class="lgd"><span><i class="sw" style="background:${C[1]}"></i>Invernaderos</span>
      <span><i class="sw" style="background:${C[3]}"></i>Extracción</span><span><i class="sw" style="background:${C[4]}"></i>Otras</span></div></div>
    <div class="card"><h3>Salida CNP</h3><p class="hint">Mismo cálculo para el circuito CNP (invernaderos N y P).</p>
      ${bars(rows.map(r=>MESNOM[r.mes]),[
        {n:"Invernaderos CNP",v:rows.map(r=>r.cnp_inv),c:C[1]},
        {n:"No explicado",v:rows.map(r=>r.cnp_otras),c:C[4]}],{w:520,h:230,stack:true})}
      <div class="lgd"><span><i class="sw" style="background:${C[1]}"></i>Invernaderos CNP</span>
      <span><i class="sw" style="background:${C[4]}"></i>No explicado</span></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Detalle mensual</h3>
    <table><thead><tr><th>Mes</th><th class="r">Días</th><th class="r">Salida RD m³</th><th class="r">Invernaderos m³</th>
      <th class="r">%</th><th class="r">Extracción m³</th><th class="r">%</th><th class="r">Otras m³</th><th class="r">%</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${MESNOM[r.mes]}</td><td class="r num">${r.dias}</td>
      <td class="r num">${fmt(r.salida)}</td><td class="r num">${fmt(r.invernaderos)}</td><td class="r num">${pct(r.invernaderos/r.salida)}</td>
      <td class="r num">${fmt(r.pmayores)}</td><td class="r num">${pct(r.pmayores/r.salida)}</td>
      <td class="r num">${fmt(r.otras)}</td><td class="r num">${pct(r.otras/r.salida)}</td></tr>`).join("")}</tbody></table></div>`;
}

function pInv(){
  const det=D.detalle_inv[MES]||[];
  const top=det.slice(0,14).map(d=>({k:d.inv+" · "+d.crop,v:d.m3,c:d.sitio==="CNP"?C[1]:C[0]}));
  return `
  <div class="grid g2">
    <div class="card"><h3>m³ por invernadero — ${MESNOM[MES]}</h3>
      <p class="hint">Azul oscuro RD · turquesa CNP</p>${hbar(top,{w:520})}</div>
    <div class="card"><h3>Litros por planta y día</h3>
      <p class="hint">Indicador comparable entre invernaderos de distinto tamaño. Rango esperado 0.3 – 3.0 L.</p>
      ${hbar(det.slice(0,14).map(d=>({k:d.inv,v:d.lpd,c:d.lpd>2.5||d.lpd<0.3?C[4]:C[2]})),{w:520,unit:"L"})}</div>
  </div>
  <div class="card" style="margin-top:14px">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div><h3>Salida RD vs. riego estimado</h3>
      <p class="hint">La misma comparación en tres granularidades. En Power BI esto es un solo gráfico con el parámetro de campo <b>Granularidad</b>.</p></div>
      <div class="seg" style="margin-left:auto" id="gran">${["Dia","Semana","Mes"].map(g=>`<button data-g="${g}" class="${g===GRAN?"on":""}">${g==="Dia"?"Día":g}</button>`).join("")}</div>
    </div>
    ${(()=>{const g=D.gran[GRAN];
      return area(g.x,[{n:"Salida RD (contador)",v:g.salida,c:C[0]},
                       {n:"Riego invernaderos RD",v:g.inv,c:C[1]},
                       {n:"Extracción de semillas",v:g.pm,c:C[3]}],
                  {w:820,h:250,fill:GRAN!=="Dia",xevery:GRAN==="Dia"?10:1})})()}
    <div class="lgd"><span><i class="sw" style="background:${C[0]}"></i>Salida RD (contador)</span>
    <span><i class="sw" style="background:${C[1]}"></i>Riego invernaderos RD</span>
    <span><i class="sw" style="background:${C[3]}"></i>Extracción de semillas</span></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Mapa de calor semanal</h3>
    <p class="hint">m³ por invernadero y semana ISO. Las celdas vacías son invernaderos sin ciclo activo o sin lectura.</p>
    <div style="overflow-x:auto">${heat(D.heatmap.invernaderos,D.heatmap.semanas,D.heatmap.valores,{w:820})}</div></div>
  <div class="card" style="margin-top:14px"><h3>Detalle por invernadero — ${MESNOM[MES]}</h3>
    <div class="scroll"><table><thead><tr><th>Invernadero</th><th>Sitio</th><th>Cultivo</th>
      <th class="r">Plantas</th><th class="r">mL/planta/día</th><th class="r">m³ del mes</th>
      <th class="r">L/planta/día</th><th class="r">Cobertura</th></tr></thead>
    <tbody>${det.map(d=>`<tr><td><b>${esc(d.inv)}</b></td><td>${d.sitio}</td><td>${esc(d.crop)}</td>
      <td class="r num">${fmt(d.plantas)}</td><td class="r num">${fmt(d.ml)}</td><td class="r num">${fmt(d.m3,1)}</td>
      <td class="r num">${fmt(d.lpd,2)}</td>
      <td class="r"><span class="tag ${d.cob>=.8?"ok":d.cob>=.5?"wr":"bd"}">${pct(d.cob,0)}</span></td></tr>`).join("")}</tbody></table></div></div>`;
}

function pFen(){
  const et=D.etapa, crops=Object.keys(et.series);
  const cur=D.curva;
  const labs=[]; for(let i=0;i<=120;i+=5)labs.push(i);
  const ser=Object.entries(cur).map(([cr,pts],i)=>({n:cr,c:C[i],
    v:labs.map(l=>{const p=pts.find(p=>p[0]===l);return p?p[1]:null})}));
  const serFill=ser.map(s=>({...s,v:s.v.map(v=>v==null?0:v)}));
  return `
  <div class="card"><h3>Curva de demanda hídrica del ciclo</h3>
    <p class="hint">Litros por planta y día según los días desde trasplante (DDT). Con esta curva se presupuesta el agua de los ciclos que vienen.</p>
    ${area(labs.map(l=>l+"d"),serFill,{w:760,h:250,fill:false,xevery:2,unit:"L"})}
    <div class="lgd">${ser.map(s=>`<span><i class="sw" style="background:${s.c}"></i>${s.n}</span>`).join("")}</div></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Consumo por etapa fenológica</h3>
      <p class="hint">Litros por planta y día promedio en cada etapa.</p>
      ${bars(["Vegetativa","Polinización","Llenado","Cosecha","Post"],
             crops.map((cr,i)=>({n:cr,v:et.series[cr],c:C[i]})),{w:520,h:250,unit:"L"})}
      <div class="lgd">${crops.map((c,i)=>`<span><i class="sw" style="background:${C[i]}"></i>${c}</span>`).join("")}</div></div>
    <div class="card"><h3>Tabla de etapas</h3>
      <p class="hint">L/planta/día. Las celdas vacías son etapas sin datos en el periodo.</p>
      <table><thead><tr><th>Cultivo</th>${et.etapas.map(e=>`<th class="r">${e}</th>`).join("")}</tr></thead>
      <tbody>${crops.map(cr=>`<tr><td><b>${cr}</b></td>${et.series[cr].map(v=>`<td class="r num">${v?fmt(v,2):"—"}</td>`).join("")}</tr>`).join("")}</tbody></table>
      <p class="hint" style="margin-top:12px">Días desde trasplante de cada hito — Tomato: polinización 30–40, cosecha 80–92 ·
      Pepper: 27–39, 75–87 · Cucumber: 30–45, 85–100 · Melon: 30–40, 64–74 · Watermelon: 30–45, 75–90 · Tomato Cherry: 24–34, 52–62.</p></div>
  </div>`;
}

function pCal(){
  const a=D.anomalias, per=D.periodos.sort((x,y)=>y.dias-x.dias);
  const alertas=D.reparto.filter(r=>r.invernaderos+r.pmayores>r.salida);
  return `
  ${alertas.length?`<div class="note"><b>Validación fallida en ${alertas.map(r=>MESNOM[r.mes]).join(", ")}:</b>
    el riego estimado más P. Mayores supera lo que entregó el contador Salida RD. Revisar el conteo de plantas de esos meses
    o una subregistración del contador.</div>`:""}
  <div class="grid g4">
    <div class="card kpi"><div class="lab">Lecturas anómalas</div><div class="val num">${a.length}</div>
      <div class="dt">de ${D.meta.registros} registros</div></div>
    <div class="card kpi"><div class="lab">Filas consolidadas</div><div class="val num">${fmt(D.meta.filas_orig)} → ${fmt(D.meta.filas_consolidadas)}</div>
      <div class="dt">se conserva el dato más alto por nave y día</div></div>
    <div class="card kpi"><div class="lab">Cobertura de medición</div><div class="val num">${pct(D.kpi.cobertura)}</div>
      <div class="dt">días con lectura de gotero</div></div>
    <div class="card kpi"><div class="lab">Invernaderos con datos</div><div class="val num">${D.meta.invernaderos}</div>
      <div class="dt">${D.meta.sets} sets en el periodo</div></div>
  </div>
  <div class="grid g23" style="margin-top:14px">
    <div class="card"><h3>Lecturas que el modelo descarta</h3>
      <p class="hint">Estas filas no entran a ningún cálculo. Hay que corregirlas en SharePoint, no en Power BI.</p>
      <div class="scroll"><table><thead><tr><th>Contador</th><th>Fecha</th><th class="r">Lectura anterior</th>
        <th class="r">Lectura actual</th><th class="r">Consumo m³</th><th>Motivo</th></tr></thead>
      <tbody>${a.map(x=>`<tr><td><b>${x.equipo}</b></td><td>${x.fecha}</td><td class="r num">${fmt(x.ant)}</td>
        <td class="r num">${fmt(x.act)}</td><td class="r num">${fmt(x.m3)}</td>
        <td><span class="tag bd">${esc(x.motivo)}</span></td></tr>`).join("")}</tbody></table></div></div>
    <div class="card"><h3>Días entre lecturas</h3>
      <p class="hint">Promedio por contador. Arriba de 7 días, el prorrateo pierde precisión.</p>
      ${hbar(per.map(p=>({k:p.equipo,v:p.dias,c:p.dias>7?C[4]:p.dias>4?C[3]:C[2]})),{w:330,unit:"días"})}</div>
  </div>
  <div class="card" style="margin-top:14px"><h3>De dónde sale cada día de riego</h3>
    <p class="hint">Todos los días del ciclo tienen valor. Los que no se midieron se interpolan entre la medición anterior y la siguiente.</p>
    ${hbar(D.estado_dato.map((e,i)=>({k:e.k,v:e.v,c:[C[2],C[5],C[3],C[4]][i]})),{w:520,unit:"días-set"})}
  </div>
  <div class="card" style="margin-top:14px"><h3>Cobertura de medición de goteros por invernadero</h3>
    <p class="hint">Porcentaje de días del mes con lectura real. Lo demás se rellena con la última lectura (máximo 7 días).</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Invernadero</th>${D.cobertura.meses.map(m=>`<th class="r">${MESNOM[m]}</th>`).join("")}</tr></thead>
    <tbody>${D.cobertura.invernaderos.map((iv,i)=>`<tr><td><b>${iv}</b></td>${D.cobertura.valores[i].map(v=>
      `<td class="r">${v==null||isNaN(v)?"—":`<span class="tag ${v>=.8?"ok":v>=.5?"wr":"bd"}">${pct(v,0)}</span>`}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
}

const REND={res:pRes,bal:pBal,dis:pDis,inv:pInv,fen:pFen,cal:pCal};
let CUR="res";

function draw(){
  const p=PAGES.find(p=>p[0]===CUR);
  document.getElementById("ttl").textContent=p[1];
  document.getElementById("dsc").textContent=p[2];
  document.getElementById("pages").innerHTML=`<div class="page on">${REND[CUR]()}</div>`;
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.p===CUR));
  document.querySelectorAll("#mes button").forEach(b=>b.classList.toggle("on",b.dataset.m===MES));
}
document.getElementById("nav").innerHTML=PAGES.map(p=>`<a data-p="${p[0]}">${p[1]}</a>`).join("");
document.getElementById("mes").innerHTML=D.reparto.map(r=>`<button data-m="${r.mes}">${MESNOM[r.mes]}</button>`).join("");
document.getElementById("nav").onclick=e=>{if(e.target.dataset.p){CUR=e.target.dataset.p;draw()}};
document.getElementById("mes").onclick=e=>{if(e.target.dataset.m){MES=e.target.dataset.m;draw()}};
document.addEventListener("click",e=>{if(e.target.dataset&&e.target.dataset.g){GRAN=e.target.dataset.g;draw()}});
draw();
</script>
